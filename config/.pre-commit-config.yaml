---
# Reference pre-commit configuration for Terraform repositories consuming the plan & apply
# engines. Copy this to `.pre-commit-config.yaml` in your repository root and adjust.
#
# The CI workflows run pre-commit AND the equivalent standalone checks. That overlap is
# deliberate: pre-commit gives developers the same result locally that CI produces, while the
# standalone steps are the merge gate and keep working even if a hook is removed from this file.
# Deleting a hook here therefore weakens local feedback, not the gate.
#
# The CI workflow always runs pre-commit and fails when this file is absent. Adding it is required.
#
# Pin every `rev` to a tag. Renovate's pre-commit manager keeps them current.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      # Terraform state and plan files carry credentials and resource detail; never commit them.
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Validate needs an initialised backend; CI runs the authenticated equivalent.
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]
      - id: terraform_checkov
        args: [--args=--config-file=__GIT_WORKING_DIR__/.checkov.yml]
      - id: terraform_docs

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

exclude: |
  (?x)^(
    \.terraform/.*|
    .*\.tfstate.*|
    .*\.terraform\.lock\.hcl
  )$
