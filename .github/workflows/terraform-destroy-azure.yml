---
# =============================================================================
# Terraform Destroy (Azure)
#
# Reusable, INPUT-DRIVEN teardown workflow modelled on the AWS terraform-destroy
# engine, for Azure. Guarded: it runs only when the `confirmation` input exactly
# equals the calling repository (owner/name), so it cannot be triggered by
# accident. Uses the READ-WRITE service principal via OIDC federated credentials.
#
# Takes a SINGLE `environment`, and always has. A teardown should be one
# explicit environment per dispatch, never a matrix that destroys every
# environment at once. Do not add a plural/array contract here, even though the
# plan and drift engines are now singular too and could look "fannable" —
# the singular input IS the safety property.
# =============================================================================
name: Terraform Destroy (Azure)

on:
  workflow_call:
    inputs:
      # --- Guard ---
      confirmation:
        description: "Must equal <owner>/<repo> of the calling repository to proceed"
        required: true
        type: string
      terraform-state-key:
        description: "State blob key (default: <environment>.tfstate)"
        required: false
        default: ""
        type: string
      # --- Terraform inputs ---
      environment:
        description: "The Terraform environment being destroyed (dev/tst/stg/prd). Also names the GitHub Environment the job enters, '<environment>-apply', which must already exist."
        required: true
        type: string
      working-directory:
        description: "Directory holding the root module"
        required: false
        default: "terraform"
        type: string
      terraform-version:
        description: "Pinned Terraform version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      node-version:
        description: "Pinned Node.js version; 'latest' is not supported"
        required: false
        default: "22"
        type: string
      tflint-version:
        description: "Pinned TFLint version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      conftest-version:
        description: "Pinned Conftest version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      infracost-version:
        description: "Pinned Infracost version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      commitlint-version:
        description: "Pinned @commitlint/cli npm version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      pre-commit-version:
        description: "Pinned pre-commit version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      install-tools:
        description: "All or nothing. 'true' installs the checksum-verified toolchain; 'false' assumes a runner image that already provides Terraform."
        required: false
        default: true
        type: boolean
      terraform-var-file:
        description: "Env var-file (default: environments/<environment>.tfvars)"
        required: false
        default: ""
        type: string
      terraform-common-var-file:
        description: "Shared var-file applied to every environment"
        required: false
        default: "environments/common.tfvars"
        type: string
      enable-provider-cache:
        description: "Restore and save the Terraform provider plugin cache around init"
        required: false
        default: true
        type: boolean
      terraform-init-extra-args:
        description: "Additional arguments passed to terraform init"
        required: false
        default: ""
        type: string
      terraform-parallelism:
        description: "Parallelism for destroy"
        required: false
        default: 10
        type: number
      runs-on:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string
      job-timeout-minutes:
        description: "Job timeout in minutes. Raise for slow Azure resources — Azure Firewall and similar can take ~45 minutes for a single resource."
        required: false
        default: 90
        type: number
      terraform-log-level:
        description: "Value for TF_LOG on the destroy run: TRACE, DEBUG, INFO, WARN, ERROR or OFF. Blank (default) disables Terraform debug logging."
        required: false
        default: ""
        type: string
      # --- Private module access (GitHub App) ---
      github-app-id:
        description: "GitHub App ID used to pull private modules (blank disables)"
        required: false
        default: ""
        type: string
      github-app-owner:
        description: "Owner the GitHub App token is scoped to"
        required: false
        default: "appvia"
        type: string
    secrets:
      github-app-private-key:
        description: "Private key for the GitHub App (required if github-app-id is set)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    # Guard: only proceed when the confirmation input matches this repository.
    if: inputs.confirmation == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    environment: ${{ inputs.environment }}-apply
    env:
      ARM_CLIENT_ID: ${{ vars.ALZ_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ALZ_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_INPUT: "0"
      TF_IN_AUTOMATION: "true"
      TF_LOG: ${{ inputs.terraform-log-level }}
      ENV: ${{ inputs.environment }}
      WORKING_DIR: ${{ inputs.working-directory }}
    steps:
      - name: Fail if confirmation does not match
        if: inputs.confirmation != github.repository
        run: |
          echo "confirmation '${{ inputs.confirmation }}' does not match repository '${{ github.repository }}'. Refusing to destroy."
          exit 1

      - name: Bootstrap
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-bootstrap@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          node-version: ${{ inputs.node-version }}
          terraform-log-level: ${{ inputs.terraform-log-level }}
          install-tools: ${{ inputs.install-tools }}
          required-tools: "terraform node"
          terraform-version: ${{ inputs.terraform-version }}
          tflint-version: ${{ inputs.tflint-version }}
          conftest-version: ${{ inputs.conftest-version }}
          infracost-version: ${{ inputs.infracost-version }}
          commitlint-version: ${{ inputs.commitlint-version }}
          pre-commit-version: ${{ inputs.pre-commit-version }}
          github-app-id: ${{ inputs.github-app-id }}
          github-app-owner: ${{ inputs.github-app-owner }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
          azure-client-id: ${{ vars.ALZ_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.ALZ_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        id: init
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-init@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          working-directory: ${{ inputs.working-directory }}
          environment: ${{ inputs.environment }}
          terraform-state-key: ${{ inputs.terraform-state-key }}
          terraform-var-file: ${{ inputs.terraform-var-file }}
          terraform-common-var-file: ${{ inputs.terraform-common-var-file }}
          enable-provider-cache: ${{ inputs.enable-provider-cache }}
          terraform-init-extra-args: ${{ inputs.terraform-init-extra-args }}
          backend-resource-group-name: ${{ vars.ALZ_BACKEND_RESOURCE_GROUP_NAME }}
          backend-storage-account-name: ${{ vars.ALZ_BACKEND_STORAGE_ACCOUNT_NAME }}
          backend-container-name: ${{ vars.ALZ_BACKEND_CONTAINER_NAME }}

      - name: Terraform destroy
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-exec@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          command: destroy
          working-directory: ${{ inputs.working-directory }}
          var-file: ${{ steps.init.outputs.tf-var-file }}
          common-var-file: ${{ steps.init.outputs.tf-common-var-file }}
          parallelism: ${{ inputs.terraform-parallelism }}
