---
# =============================================================================
# Terraform Plan & Apply (Azure)
#
# Reusable, INPUT-DRIVEN workflow modelled on the AWS
# terraform-plan-and-apply-aws.yml engine, but for Azure. It handles a SINGLE
# environment per call: on pull requests it runs one validate+plan job (fmt,
# lint, Checkov, plan, OPA, Infracost) that also posts the PR comment and acts
# as the merge gate. On push to the default branch (i.e. after merge) it skips
# that job entirely — the merge gate already ran it — and runs only the apply
# job using the read-write service principal (re-plan + apply).
#
# Covering several environments is the caller's job — fan out with
# `strategy.matrix` over the `uses:` that calls this workflow. Artifact and
# comment names stay environment-scoped because that fan-out produces a single
# workflow run shared by every leg.
#
# The binary plan is never persisted or reused: the PR job deletes it after
# JSON conversion, and the apply job re-plans against current state before
# applying — no saved plan artifact is carried from PR to merge.
#
# All configuration arrives as `inputs` passed in from the calling repo
# — NOT GitHub environment vars. Only true secrets come via `secrets:`.

name: Terraform Plan & Apply (Azure)

on:
  workflow_call:
    inputs:
      enable-apply:
        description: "Run terraform apply on push to the default branch"
        required: false
        default: true
        type: boolean
      # --- Remote state backend (azurerm) ---
      terraform-state-key:
        description: "State blob key (default: <environment>.tfstate)"
        required: false
        default: ""
        type: string
      # --- Terraform inputs ---
      environment:
        description: 'The Terraform environment to plan/apply (e.g. "dev"). Also names the two GitHub Environments the jobs enter, "<environment>-plan" and "<environment>-apply", which must already exist. To cover several environments, fan out with strategy.matrix on the calling job.'
        required: true
        type: string
      working-directory:
        description: "Directory holding the root module"
        required: false
        default: "terraform"
        type: string
      terraform-version:
        description: "Pinned Terraform version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      node-version:
        description: "Pinned Node.js version; 'latest' is not supported"
        required: false
        default: "22"
        type: string
      install-tools:
        description: >-
          All or nothing. 'true' installs the complete checksum-verified toolchain (Terraform,
          TFLint, Conftest, Infracost, commitlint, pre-commit); 'false' installs nothing and
          instead verifies that a bring-your-own runner image already provides them. When 'false',
          every *-version input is ignored.
        required: false
        default: true
        type: boolean
      tflint-version:
        description: "Pinned TFLint version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      # Note: no checkov-version input — the pinned bridgecrewio/checkov-action
      # fixes the Checkov version via its Docker tag.
      conftest-version:
        description: "Pinned Conftest version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      infracost-version:
        description: "Pinned Infracost version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      commitlint-version:
        description: "Pinned @commitlint/cli npm version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      terraform-var-file:
        description: "Env var-file (default: environments/<environment>.tfvars)"
        required: false
        default: ""
        type: string
      terraform-common-var-file:
        description: "Shared var-file applied to every environment"
        required: false
        default: "environments/common.tfvars"
        type: string
      enable-provider-cache:
        description: "Restore and save the Terraform provider plugin cache around init"
        required: false
        default: true
        type: boolean
      terraform-init-extra-args:
        description: "Additional arguments passed to terraform init"
        required: false
        default: ""
        type: string
      terraform-plan-extra-args:
        description: "Extra args appended to terraform plan"
        required: false
        default: ""
        type: string
      terraform-parallelism:
        description: "Parallelism for plan"
        required: false
        default: 10
        type: number
      runs-on:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string
      job-timeout-minutes:
        description: "Job timeout in minutes, applied to both the plan and apply jobs. Raise for slow Azure resources — Azure Firewall and similar can take ~45 minutes for a single resource."
        required: false
        default: 90
        type: number
      # --- Feature toggles (mirror the AWS engine) ---
      enable-commitlint:
        description: "Run commitlint on the PR commits"
        required: false
        default: false
        type: boolean
      pre-commit-config-file:
        description: "Pre-commit configuration file. The workflow fails when it does not exist; config/.pre-commit-config.yaml in the CI/CD repository is a reference to copy."
        required: false
        default: ".pre-commit-config.yaml"
        type: string
      pre-commit-version:
        description: "Pinned pre-commit version (required when install-tools is true)"
        required: false
        default: ""
        type: string
      upload-sarif:
        description: "Upload Checkov SARIF results to GitHub Security"
        required: false
        default: true
        type: boolean
      enable-infracost:
        description: "Run Infracost cost estimation (needs infracost-api-key)"
        required: false
        default: false
        type: boolean
      terraform-log-level:
        description: "Value for TF_LOG on plan & apply: TRACE, DEBUG, INFO, WARN, ERROR or OFF. Blank (default) disables Terraform debug logging."
        required: false
        default: ""
        type: string
      # --- Private module access (GitHub App) ---
      github-app-id:
        description: "GitHub App ID used to pull private modules (blank disables)"
        required: false
        default: ""
        type: string
      github-app-owner:
        description: "Owner the GitHub App token is scoped to"
        required: false
        default: "appvia"
        type: string
    secrets:
      infracost-api-key:
        description: "Infracost API key (required if enable-infracost)"
        required: false
      github-app-private-key:
        description: "Private key for the GitHub App (required if github-app-id is set)"
        required: false

permissions:
  id-token: write        # OIDC federation to Azure
  contents: read
  pull-requests: write   # PR comment
  security-events: write # SARIF upload
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Validate & Plan — single job so the plan binary never leaves the runner,
  # tool binaries are installed once, and downstream analysis runs in-context.
  # It also posts the PR comment and carries the merge gate as its final step.
  #
  # Skipped exactly when the apply job below will run: every check here (lint,
  # Checkov, OPA, plan) already passed on the PR that produced the merge commit,
  # so repeating it on the way to apply costs runner time for no extra signal.
  # ---------------------------------------------------------------------------
  validate-and-plan:
    name: Validate and Plan (${{ inputs.environment }})
    if: >-
      !(inputs.enable-apply &&
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    environment: ${{ inputs.environment }}-plan
    env:
      ARM_CLIENT_ID: ${{ vars.ALZ_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ALZ_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ENV: ${{ inputs.environment }}
      WORKING_DIR: ${{ inputs.working-directory }}
    steps:
      - name: Bootstrap
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-bootstrap@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          terraform-log-level: ${{ inputs.terraform-log-level }}
          # Full history so commitlint can reach the PR base commit
          fetch-depth: 0
          install-tools: ${{ inputs.install-tools }}
          required-tools: "terraform tflint conftest infracost commitlint pre-commit node npm"
          node-version: ${{ inputs.node-version }}
          terraform-version: ${{ inputs.terraform-version }}
          tflint-version: ${{ inputs.tflint-version }}
          conftest-version: ${{ inputs.conftest-version }}
          infracost-version: ${{ inputs.infracost-version }}
          commitlint-version: ${{ inputs.commitlint-version }}
          pre-commit-version: ${{ inputs.pre-commit-version }}
          github-app-id: ${{ inputs.github-app-id }}
          github-app-owner: ${{ inputs.github-app-owner }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
          azure-client-id: ${{ vars.ALZ_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.ALZ_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Commitlint / Format / Lint (fast checks; non-blocking, reported later)
      # -----------------------------------------------------------------------
      - name: Retrieve commitlint config
        if: github.event_name == 'pull_request' && inputs.enable-commitlint
        run: |
          cp config/commitlint.config.js commitlint.config.js

      - name: Commitlint
        id: commitlint
        if: github.event_name == 'pull_request' && inputs.enable-commitlint
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --config commitlint.config.js 2>&1 | tee "$GITHUB_WORKSPACE/commitlint_output_${ENV}.txt"

      # Deliberately overlaps the standalone checks below: pre-commit proves the consumer's hooks
      # still run, the standalone steps provide hardcoded guardrails that can't be bypassed.
      - name: Pre-commit
        id: pre_commit
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/pre-commit-check@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          config-file: ${{ inputs.pre-commit-config-file }}
          output-file: pre_commit_output_${{ inputs.environment }}.txt

      - name: Terraform format check
        id: fmt_check
        continue-on-error: true
        run: |
          set -euo pipefail
          terraform -chdir="$WORKING_DIR" fmt -check -recursive 2>&1 | tee "$GITHUB_WORKSPACE/fmt_check_output_${ENV}.txt"

      - name: Prepare local TFLint config
        run: |
          if [ -f config/.tflint.hcl ]; then
            cp config/.tflint.hcl "$WORKING_DIR/.tflint.hcl"
            echo "using config/.tflint.hcl"
          elif [ -f .tflint.hcl ]; then
            cp .tflint.hcl "$WORKING_DIR/.tflint.hcl"
            echo "using repo-root .tflint.hcl"
          elif [ -f "$WORKING_DIR/.tflint.hcl" ]; then
            echo "using working-directory .tflint.hcl"
          else
            echo "no local TFLint config found; using TFLint defaults"
          fi

      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: |
          set -euo pipefail
          tflint --chdir="$WORKING_DIR" --init
          tflint --chdir="$WORKING_DIR" -f compact 2>&1 | tee "$GITHUB_WORKSPACE/tflint_output_${ENV}.txt"

      # Init early: Checkov's --var-file needs TF_VAR_FILE, which this step
      # resolves and exports, and the plan below reuses the same backend.
      - name: Terraform init
        id: init
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-init@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          working-directory: ${{ inputs.working-directory }}
          environment: ${{ inputs.environment }}
          terraform-state-key: ${{ inputs.terraform-state-key }}
          terraform-var-file: ${{ inputs.terraform-var-file }}
          terraform-common-var-file: ${{ inputs.terraform-common-var-file }}
          enable-provider-cache: ${{ inputs.enable-provider-cache }}
          terraform-init-extra-args: ${{ inputs.terraform-init-extra-args }}
          backend-resource-group-name: ${{ vars.ALZ_BACKEND_RESOURCE_GROUP_NAME }}
          backend-storage-account-name: ${{ vars.ALZ_BACKEND_STORAGE_ACCOUNT_NAME }}
          backend-container-name: ${{ vars.ALZ_BACKEND_CONTAINER_NAME }}
          output-file: init_output_${{ inputs.environment }}.txt

      # Checkov runs directly after init: it is a static directory scan, so inline skip-comments
      # apply and no plan output is needed, but it does need the var-files init resolves.
      - name: Checkov security scan
        id: checkov
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-checkov-scan@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          environment: ${{ inputs.environment }}
          working-directory: ${{ inputs.working-directory }}
          var-file: ${{ steps.init.outputs.tf-var-file }}
          common-var-file: ${{ steps.init.outputs.tf-common-var-file }}
          upload-sarif: ${{ inputs.upload-sarif }}

      - name: Terraform validate
        id: validate
        continue-on-error: true
        run: terraform -chdir="$WORKING_DIR" validate -no-color

      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error. The binary plan is converted
      # to JSON and deleted inside the action, so it never reaches an artifact.
      - name: Terraform plan
        id: plan
        # Skip rather than run against an uninitialised backend or an unresolved var-file: init
        # owns both, and the merge gate already fails on an init failure.
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-exec@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          command: plan
          working-directory: ${{ inputs.working-directory }}
          var-file: ${{ steps.init.outputs.tf-var-file }}
          common-var-file: ${{ steps.init.outputs.tf-common-var-file }}
          parallelism: ${{ inputs.terraform-parallelism }}
          extra-args: ${{ inputs.terraform-plan-extra-args }}
          out-file: tfplan.${{ inputs.environment }}
          detailed-exitcode: "true"
          convert-to-json: "true"
          json-file: tfplan_${{ inputs.environment }}.json
          output-file: plan_output_${{ inputs.environment }}.txt
          fail-on-error: "false"

      - name: Terraform plan summary
        if: steps.plan.outputs.json-outcome == 'success'
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-plan-summary@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          plan-json: ${{ steps.plan.outputs.json-path }}
          title: "Terraform Plan Summary"

      - name: Generate plan HTML report
        id: plan_html
        if: steps.plan.outputs.json-outcome == 'success'
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-plan-report@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          plan-json: ${{ steps.plan.outputs.json-path }}
          output-file: plan_report_${{ inputs.environment }}.html

      # -----------------------------------------------------------------------
      # OPA — repository-local policies, verified before test
      # -----------------------------------------------------------------------
      - name: OPA local policy check
        id: opa_local
        if: steps.plan.outputs.json-outcome == 'success'
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-opa-check@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          policies-directory: policies/opa
          plan-json: ${{ steps.plan.outputs.json-path }}
          verify-output-file: rego_validate_local_output_${{ inputs.environment }}.txt
          test-output-file: opa_local_output_${{ inputs.environment }}.txt


      # -----------------------------------------------------------------------
      # Infracost
      # -----------------------------------------------------------------------
      - name: Infracost
        id: infracost
        # env (not secrets) in `if:` — secrets can't be evaluated in conditions
        if: inputs.enable-infracost && steps.plan.outputs.json-outcome == 'success' && env.INFRACOST_API_KEY != ''
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ secrets.infracost-api-key }}
        run: |
          set -euo pipefail
          infracost breakdown --path "${WORKING_DIR}/tfplan_${ENV}.json" --format table 2>&1 | tee "infracost_${ENV}.txt"

      # -----------------------------------------------------------------------
      # Collect outcomes + upload artifact (no binary plan — already deleted)
      # -----------------------------------------------------------------------
      - name: Collect step outcomes
        if: always()
        run: |
          cat > "outcomes_${ENV}.json" <<EOF_OUTCOMES
          {
            "environment": "${ENV}",
            "commitlint": "${{ steps.commitlint.outcome }}",
            "pre_commit": "${{ steps.pre_commit.outputs.outcome }}",
            "fmt_check": "${{ steps.fmt_check.outcome }}",
            "tflint": "${{ steps.tflint.outcome }}",
            "init": "${{ steps.init.outcome }}",
            "validate": "${{ steps.validate.outcome }}",
            "plan": "${{ steps.plan.outcome }}",
            "plan_json": "${{ steps.plan.outputs.json-outcome }}",
            "plan_exit": "${{ steps.plan.outputs.exit-code }}",
            "checkov": "${{ steps.checkov.outcome }}",
            "opa_local": "${{ steps.opa_local.outputs.outcome }}",
            "infracost": "${{ steps.infracost.outcome }}"
          }
          EOF_OUTCOMES

      # Uploaded before the comment step: the comment links the artifact by ID, so it has to exist.
      - name: Upload plan outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ inputs.environment }}
          path: |
            outcomes_${{ inputs.environment }}.json
            commitlint_output_${{ inputs.environment }}.txt
            pre_commit_output_${{ inputs.environment }}.txt
            fmt_check_output_${{ inputs.environment }}.txt
            init_output_${{ inputs.environment }}.txt
            tflint_output_${{ inputs.environment }}.txt
            plan_output_${{ inputs.environment }}.txt
            plan_report_${{ inputs.environment }}.html
            checkov_output_${{ inputs.environment }}.txt
            rego_validate_local_output_${{ inputs.environment }}.txt
            opa_local_output_${{ inputs.environment }}.txt
            infracost_${{ inputs.environment }}.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      # In-job, so the logs are read straight from the workspace — no artifact round-trip.
      - name: Post / update comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-plan-comment@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows

      # Several checks report their result via an output rather than the step
      # conclusion, so a failure here can follow a green step above — name them.
      - name: Final result
        if: always()
        env:
          RESULT_COMMITLINT: ${{ steps.commitlint.outcome }}
          RESULT_PRE_COMMIT: ${{ steps.pre_commit.outputs.outcome }}
          RESULT_FMT_CHECK: ${{ steps.fmt_check.outcome }}
          RESULT_TFLINT: ${{ steps.tflint.outcome }}
          RESULT_INIT: ${{ steps.init.outcome }}
          RESULT_VALIDATE: ${{ steps.validate.outcome }}
          RESULT_PLAN: ${{ steps.plan.outputs.failed == 'true' && 'failure' || steps.plan.outcome }}
          RESULT_PLAN_JSON: ${{ steps.plan.outputs.json-outcome }}
          RESULT_CHECKOV: ${{ steps.checkov.outcome }}
          RESULT_OPA_LOCAL: ${{ steps.opa_local.outputs.outcome }}
        run: |
          set -uo pipefail
          failures=()
          record() {
            if [ "$2" = "failure" ]; then
              failures+=("$1")
            fi
          }
          record "Commitlint" "$RESULT_COMMITLINT"
          record "Pre-commit" "$RESULT_PRE_COMMIT"
          record "Terraform format check" "$RESULT_FMT_CHECK"
          record "TFLint" "$RESULT_TFLINT"
          record "Terraform init" "$RESULT_INIT"
          record "Terraform validate" "$RESULT_VALIDATE"
          record "Terraform plan" "$RESULT_PLAN"
          record "Terraform plan (JSON)" "$RESULT_PLAN_JSON"
          record "Checkov security scan" "$RESULT_CHECKOV"
          record "OPA local policy check" "$RESULT_OPA_LOCAL"
          if [ ${#failures[@]} -eq 0 ]; then
            echo "All checks passed."
            exit 0
          fi
          echo "The following checks failed for ${ENV}:"
          printf '  - %s\n' "${failures[@]}"
          {
            echo "### Failed checks (${ENV})"
            printf -- '- %s\n' "${failures[@]}"
            echo ""
            echo "Expand the corresponding step above, or download the \`plan-${ENV}\` artifact, for the full output."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------------------
  # Apply — runs ONLY on push to the default branch (i.e. after a PR merges),
  # and is the only job that runs then. Uses the READ-WRITE service principal.
  # Re-plans then applies (the PR plan binary is intentionally not persisted),
  # so apply reflects current state.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (${{ inputs.environment }})
    if: >-
      inputs.enable-apply &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    environment: ${{ inputs.environment }}-apply
    env:
      ARM_CLIENT_ID: ${{ vars.ALZ_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ALZ_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}
      ENV: ${{ inputs.environment }}
      WORKING_DIR: ${{ inputs.working-directory }}
    steps:
      - name: Bootstrap
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-bootstrap@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          terraform-log-level: ${{ inputs.terraform-log-level }}
          install-tools: ${{ inputs.install-tools }}
          required-tools: "terraform node"
          node-version: ${{ inputs.node-version }}
          terraform-version: ${{ inputs.terraform-version }}
          tflint-version: ${{ inputs.tflint-version }}
          conftest-version: ${{ inputs.conftest-version }}
          infracost-version: ${{ inputs.infracost-version }}
          commitlint-version: ${{ inputs.commitlint-version }}
          pre-commit-version: ${{ inputs.pre-commit-version }}
          github-app-id: ${{ inputs.github-app-id }}
          github-app-owner: ${{ inputs.github-app-owner }}
          github-app-private-key: ${{ secrets.github-app-private-key }}
          azure-client-id: ${{ vars.ALZ_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.ALZ_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.ALZ_AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        id: init
        uses: appvia/appvia-cicd-workflows/.github/actions/azure-terraform-init@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          working-directory: ${{ inputs.working-directory }}
          environment: ${{ inputs.environment }}
          terraform-state-key: ${{ inputs.terraform-state-key }}
          terraform-var-file: ${{ inputs.terraform-var-file }}
          terraform-common-var-file: ${{ inputs.terraform-common-var-file }}
          enable-provider-cache: ${{ inputs.enable-provider-cache }}
          terraform-init-extra-args: ${{ inputs.terraform-init-extra-args }}
          backend-resource-group-name: ${{ vars.ALZ_BACKEND_RESOURCE_GROUP_NAME }}
          backend-storage-account-name: ${{ vars.ALZ_BACKEND_STORAGE_ACCOUNT_NAME }}
          backend-container-name: ${{ vars.ALZ_BACKEND_CONTAINER_NAME }}

      - name: Terraform apply
        uses: appvia/appvia-cicd-workflows/.github/actions/terraform-exec@66dd7b475f38f66babc1af0fbc49efd301e06a17 # feat/splitting-out-workflows
        with:
          command: apply
          working-directory: ${{ inputs.working-directory }}
          var-file: ${{ steps.init.outputs.tf-var-file }}
          common-var-file: ${{ steps.init.outputs.tf-common-var-file }}
          parallelism: ${{ inputs.terraform-parallelism }}
