---
name: "Terraform Plan Summary"
description: "Write a concise Terraform plan summary to the GitHub Actions job summary"

inputs:
  plan-json:
    description: "Path to the plan JSON, relative to GITHUB_WORKSPACE"
    required: true
  title:
    description: "Heading written to the GitHub Actions job summary"
    required: false
    default: "Terraform Plan Summary"
  output-file:
    description: "Optional additional Markdown summary file, relative to GITHUB_WORKSPACE."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Write Terraform plan summary
      shell: bash
      env:
        PLAN_JSON: ${{ inputs.plan-json }}
        TITLE: ${{ inputs.title }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/scripts/write-summary.js" "$GITHUB_WORKSPACE/$PLAN_JSON" "$GITHUB_STEP_SUMMARY" "$TITLE"
        if [[ -n ${OUTPUT_FILE} ]]; then
          node "$GITHUB_ACTION_PATH/scripts/write-summary.js" "$GITHUB_WORKSPACE/$PLAN_JSON" "$GITHUB_WORKSPACE/$OUTPUT_FILE" "$TITLE"
        fi
