---
name: Terragrunt Plan Summary
description: "Aggregates the matrix plan summaries from terragrunt-plan-collect into a single report, posted to the job summary and pull request"
inputs:
  comment:
    description: "Whether to post the report as a comment on the pull request"
    required: false
    default: "true"
  environment:
    description: "The environment being planned, must match the value given to terragrunt-plan-collect"
    required: true
  expected:
    description: "The number of matrix units expected to report, any missing are treated as a failure"
    required: false
    default: "0"

outputs:
  changes:
    description: "Whether any unit has changes (true or false)"
    value: ${{ steps.report.outputs.changes }}
  result-auth:
    description: "The aggregated outcome of authentication across the matrix"
    value: ${{ steps.report.outputs.result-auth }}
  result-plan:
    description: "The aggregated outcome of the plan across the matrix"
    value: ${{ steps.report.outputs.result-plan }}

runs:
  using: "composite"
  steps:
    - name: Download Plan Summaries
      # A missing summary is reported against the expected count, rather than failing here
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: plan-summary-${{ inputs.environment }}--*
        path: ${{ runner.temp }}/plan-summaries

    - name: Generate Report
      id: report
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLAN_SUMMARY_COMMENT: ${{ inputs.comment }}
        PLAN_SUMMARY_DIRECTORY: ${{ runner.temp }}/plan-summaries
        PLAN_SUMMARY_ENVIRONMENT: ${{ inputs.environment }}
        PLAN_SUMMARY_EXPECTED: ${{ inputs.expected }}
      with:
        script: |
          const { run } = require(`${process.env.ACTION_PATH}/report.js`);
          await run({
            github,
            context,
            core,
            inputs: {
              comment: process.env.PLAN_SUMMARY_COMMENT,
              directory: process.env.PLAN_SUMMARY_DIRECTORY,
              environment: process.env.PLAN_SUMMARY_ENVIRONMENT,
              expected: process.env.PLAN_SUMMARY_EXPECTED,
            },
          });
