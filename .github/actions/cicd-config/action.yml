---
name: "Centralised Configuration"
description: "Copies a centralised configuration file from this repository into the caller's workspace"
inputs:
  source:
    description: "The path of the file within the cicd-workflows repository"
    required: true
  destination:
    description: "The path to write the file to, relative to the working directory"
    required: true
  working-directory:
    description: "The working directory to write the file into"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    # When an action is used from another repository, the runner checks out the
    # entire repository into $GITHUB_ACTION_PATH/../../.. - so the centralised
    # configuration ships with the action and no network access is required.
    - name: Copy Centralised Configuration
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SOURCE: ${{ inputs.source }}
        DESTINATION: ${{ inputs.destination }}
      run: |
        cp "${GITHUB_ACTION_PATH}/../../../${SOURCE}" "${DESTINATION}"
